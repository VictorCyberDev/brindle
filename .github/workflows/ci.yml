name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No job below needs any secret. Sponsor integrations (Zetaris, Meterless,
# Nemotron) are not called in M0, and database checks run in-process (PGlite).
jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (includes migration applied to in-process PostgreSQL)
        run: npm test
      - name: Migration consistency
        run: |
          npm run db:check
          npm run db:generate
          git diff --exit-code -- drizzle || { echo "::error::Schema changed without a committed migration. Run npm run db:generate."; exit 1; }
          test -z "$(git ls-files --others --exclude-standard -- drizzle)" || { echo "::error::Untracked migration files were generated."; exit 1; }
      - name: Production build
        run: npm run build

  e2e:
    name: E2E smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
